# Free public demo only. This file deliberately creates no database resource.
# Supply a dedicated Supabase Free Postgres connection string in the API service.
services:
  - type: web
    name: cybersandbox-api-free
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "3"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_CA_BASE64
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: MIGRATOR_DATABASE_URL
        sync: false
      - key: CYBERSANDBOX_APP_PASSWORD
        sync: false

  - type: web
    name: cybersandbox-web-free
    runtime: static
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_ORIGIN
        value: https://cybersandbox-api-free.onrender.com
