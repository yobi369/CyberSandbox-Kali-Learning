name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cybersandbox_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cybersandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybersandbox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck


      - name: Build API
        run: npm run api:build

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Provision restricted API runtime role
        env:
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cybersandbox_test
          CYBERSANDBOX_APP_PASSWORD: ci-only-runtime-password-with-at-least-32-characters
        run: sh ops/postgres/apply-runtime-role.sh

      - name: Unit and PostgreSQL integration tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build staging API container
        run: docker build --file Dockerfile.api --tag cybersandbox-api:ci .

