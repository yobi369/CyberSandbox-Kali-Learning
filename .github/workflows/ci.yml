name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cybersandbox_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cybersandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybersandbox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck


      - name: Build API
        run: npm run api:build

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Provision restricted API runtime role
        env:
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cybersandbox_test
          CYBERSANDBOX_APP_PASSWORD: ci-only-runtime-password-with-at-least-32-characters
        run: sh ops/postgres/apply-runtime-role.sh

      - name: Unit and PostgreSQL integration tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build staging API container
        run: docker build --file Dockerfile.api --tag cybersandbox-api:ci .


      - name: Validate local Compose configuration
        env:
          POSTGRES_PASSWORD: ci-local-postgres-password-with-32-characters
          CYBERSANDBOX_APP_PASSWORD: ci-local-runtime-password-with-48-characters-minimum
        run: docker compose config --quiet

      - name: Start local stack and run container smoke tests
        env:
          POSTGRES_PASSWORD: ci-local-postgres-password-with-32-characters
          CYBERSANDBOX_APP_PASSWORD: ci-local-runtime-password-with-48-characters-minimum
        run: |
          set -eu
          docker compose up --build --detach
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          api_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health > /tmp/cybersandbox-health.json; then
              api_ready=true
              break
            fi
            sleep 2
          done
          test "$api_ready" = true
          grep -q '"status":"ok"' /tmp/cybersandbox-health.json

          frontend_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/cybersandbox-frontend.html; then
              frontend_ready=true
              break
            fi
            sleep 2
          done
          test "$frontend_ready" = true
          grep -qi '<html' /tmp/cybersandbox-frontend.html

          # Confirm the frontend development proxy reaches the API.
          curl --fail --silent http://127.0.0.1:3000/health | grep -q '"status":"ok"'

          # Confirm migrations ran and the restricted role can connect.
          migration_count="$(docker compose exec -T db psql -U postgres -d cybersandbox -Atc 'SELECT count(*) FROM schema_migrations')"
          test "$migration_count" = "3"
          docker compose exec -T -e PGPASSWORD="$CYBERSANDBOX_APP_PASSWORD" db \
            psql -h 127.0.0.1 -U cybersandbox_app -d cybersandbox -Atc 'SELECT current_user' |
            grep -qx 'cybersandbox_app'
